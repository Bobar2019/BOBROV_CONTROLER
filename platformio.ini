; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Décommenter et adapter quand l'ESP32 est connecté en USB :
; upload_port = /dev/cu.usbmodem*
; monitor_port = /dev/cu.usbmodem*
board_build.partitions = bob_control_8mb.csv
board_build.filesystem = littlefs
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Version Git du projet définie dans l'en-tête généré include/git_version.h
; (scripts/git_version.py — git describe --tags --always --dirty, fallback "dev")
extra_scripts = pre:scripts/git_version.py

lib_deps = 
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit NeoPixel @ ^1.12.0
    robtillaart/INA226 @ ^0.6.0